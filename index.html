<!doctype html>
<html lang="nb"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#20332b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>PythOnline</title><link rel="stylesheet" href="style.css?v=4"><script type="module" src="app.js?v=4"></script>
</head><body>
<header class="topbar">
  <a class="brand" href="./"><img src="icons/icon.svg" alt="" width="28" height="28"> PythOnline</a>
  <div class="actions"><button id="open" data-i18n="↑ Open .py">↑ Åpne .py</button><button id="save" data-i18n="↓ Save">↓ Lagre</button><button id="run" class="primary" disabled data-i18n="▶ Run code">▶ Kjør kode</button><button id="stop" disabled data-i18n="■ Stop">■ Stopp</button></div>
  <div class="app-actions"><button id="fullscreen" aria-pressed="false">Fullskjerm</button><button id="install">Installer app</button></div>
  <label class="language-picker"><span data-i18n="Language">Språk</span><select id="language"><option value="nb">Norsk</option><option value="en">English</option></select></label>
</header>
<main>
  <div class="workspace-bar"><div role="tablist" aria-label="Arbeidsområde" data-i18n-aria-label="Workspace"><button id="code-tab" role="tab" aria-selected="true" aria-controls="code-panel" data-i18n="Code">Kode</button><button id="terminal-tab" role="tab" aria-selected="false" aria-controls="terminal-panel" tabindex="-1">Terminal</button></div><span id="status" role="status">Laster Python…</span><button id="retry" hidden data-i18n="Retry loading">Prøv igjen</button></div>
  <p id="hint" role="status" hidden></p>
  <section id="code-panel" role="tabpanel" aria-labelledby="code-tab"><div class="filebar"><span id="filename">hello.py</span><span id="line-count"></span></div><div class="editor-wrap"><div id="line-numbers" aria-hidden="true"></div><textarea id="editor" aria-label="Python-kode" data-i18n-aria-label="Python code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off"></textarea></div></section>
  <section id="terminal-panel" role="tabpanel" aria-labelledby="terminal-tab" hidden><div class="terminal-tools"><label><input id="interpreter" type="checkbox"> <span data-i18n="Interpreter (>>>)">Interaktiv Python (&gt;&gt;&gt;)</span></label><button id="clear" data-i18n="Clear">Tøm</button></div><div id="terminal-body"><pre id="output" role="log" aria-label="Utdata fra Python" data-i18n-aria-label="Python output" aria-live="polite"></pre><form id="input-form" hidden><label id="prompt" for="terminal-input">›</label><input id="terminal-input" autocomplete="off" spellcheck="false" autocapitalize="off" aria-label="Svar til programmet" data-i18n-aria-label="Program input"><button type="submit" data-i18n="Send ↵">Send ↵</button></form></div></section>
</main><input id="file-input" type="file" accept=".py,text/x-python" hidden>
</body></html>
